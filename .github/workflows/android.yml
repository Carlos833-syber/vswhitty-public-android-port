name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'coderabbit/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - uses: android-actions/setup-android@v3
        with:
          # Recent command-line tools require Java 17; this version supports Java 11.
          cmdline-tools-version: '8512546'
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-33' 'build-tools;30.0.3' 'ndk;21.4.7075529'
      - name: Install Haxe libraries
        run: bash scripts/setup-android.sh
      - name: Build signed debug APK
        env:
          ANDROID_SETUP: 'true'
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          haxelib run lime build android -debug -D HXCPP_ARM64 -D HXCPP_COMPILE_THREADS=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VS-Whitty-Android-arm64-debug
          path: export/debug/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
